extends: _base
name: power_orchestrator
description: >-
  Coordinator. Plans the run, routes work to specialists, owns the state machine
  and the single human approval gate. Has no capability tools by design.
template: orchestrator.md

# The toolset is the enforcement mechanism: with no bash, no web, and no editor,
# "you conduct, you don't perform" is structural rather than an instruction the
# model might drift from.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: write, enabled: true }
      - { name: glob, enabled: true }
      - { name: grep, enabled: true }
  - type: custom
    name: run_gate
    description: >-
      Run the deterministic gate for a pipeline stage. Returns
      {"pass": bool, "errors": [{"artifact","field","rule","detail"}]}.
      Call this at every stage boundary; a stage is complete only when it passes.
    input_schema:
      type: object
      properties:
        stage:
          type: string
          enum: [research, spec, verification]
          description: The pipeline stage whose artifacts should be checked.
      required: [stage]

delegates_to:
  - power_researcher
  - power_architect
  - power_implementer
  - power_reviewer
  - power_tester
  - power_verifier
  - power_documenter

# In Claude Code this agent is the autonomous driver persona — pick it as the
# session's agent and it runs a whole goal unattended. `/power` drives the same
# pipeline from the skill instead; both paths dispatch the same specialists.
#
# The `run_gate` custom tool becomes two narrowly scoped Bash grants. That is a
# stronger boundary than the CMA toolset, not a weaker one: this agent can
# execute the gate and the state machine and literally nothing else, so "you
# conduct, you don't perform" stays structural.
plugin:
  name: orchestrator
  model: opus
  tools:
    - Read
    - Glob
    - Grep
    - Write
    - AskUserQuestion
    - TodoWrite
    - Bash(node "${CLAUDE_PLUGIN_ROOT}/scripts/gate.mjs" *)
    - Bash(node "${CLAUDE_PLUGIN_ROOT}/scripts/run-state.mjs" *)
    - Bash(node "${CLAUDE_PLUGIN_ROOT}/scripts/knowledge.mjs" *)
    - Agent(power:researcher, power:architect, power:implementer, power:reviewer, power:tester, power:verifier, power:documenter)
  core_blocks:
    - identity
    - pipeline
    - state_machine
    - delegation
    - feedback_edges
    - never_do
    - critical_rules
  reference_hints:
    human_approval_gate: before asking the user to approve the plan
    deploy_guardrail: before allowing anything to ship
    blocked_runs: when a retry cap is reached
    recovery: when resuming an interrupted run
