<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The wordmark is `power/` and the slash is the part that carries it, so the
    mark is just the slash. At 16px in a browser tab nothing more survives:
    a letterform would turn to mush, whereas one thick diagonal at full contrast
    stays legible at any size. Warm paper ground, terracotta stroke — the same
    two colours the page is built from.
  -->
  <rect width="64" height="64" rx="14" fill="#faf9f5" />
  <path d="M40.5 14 L29 50" stroke="#191817" stroke-width="7.5" stroke-linecap="round" />
  <circle cx="21" cy="46" r="4" fill="#b4522f" />
</svg>
