name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The deterministic gate ahead of any model-based review. Everything here
      # is a file-existence or reference check — cheap, exact, and the class of
      # problem an LLM reviewer is a wasteful way to catch. A missing template,
      # a dead section reference, an unknown model id, or an unresolved
      # placeholder fails the build rather than shipping with a warning.
      - name: Validate agent registry and capability packs
        run: pnpm validate

      - name: Test
        run: pnpm test

      # `agents/` and `skills/power/reference/` are generated from the prompts
      # but committed, because the plugin *is* this repository — an installed
      # user gets whatever is checked in. So a prompt edit that was never rebuilt
      # ships the old text while the diff looks correct. Rebuilding and diffing
      # is the only thing that catches it.
      - name: Plugin build is committed and reproducible
        run: |
          set -e
          pnpm build:plugin
          if ! git diff --quiet -- agents skills/power/reference; then
            echo "::error::agents/ or skills/power/reference/ is stale — run 'pnpm build:plugin' and commit"
            git diff --stat -- agents skills/power/reference
            exit 1
          fi
          echo "generated plugin tree matches the committed one"

      # Guards the claim the gate layer makes about itself: the golden fixtures
      # must pass and the deliberately broken ones must fail. A gate that cannot
      # fail is not a gate.
      - name: Gate fixtures behave in both directions
        run: |
          set -e
          cd packages/gates
          for stage in research spec verification; do
            pnpm exec tsx src/cli.ts "$stage" test/fixtures/golden
          done
          for stage in research spec verification; do
            if pnpm exec tsx src/cli.ts "$stage" test/fixtures/broken > /dev/null 2>&1; then
              echo "::error::the $stage gate passed a deliberately broken fixture"
              exit 1
            fi
          done
          echo "golden fixtures pass and broken fixtures fail, as expected"

  # The website must build and its copy must be present in the static HTML —
  # if the headline is not in out/index.html, crawlers never see it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Copy is in the static HTML
        run: |
          for s in "You describe." "Gates decide." "plugin install power"; do
            grep -qF "$s" apps/web/out/index.html || { echo "::error::'$s' missing from static HTML"; exit 1; }
          done

  # The Swift engine must stay a faithful peer of the TS engine (ADR 0005):
  # typecheck every file, then run the full mock pipeline — real state
  # machine, real gates — headlessly on the macOS runner.
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck   # builds the dist CLIs the Swift engine calls
      - name: Typecheck Swift sources
        run: swiftc -typecheck -sdk $(xcrun --show-sdk-path) -parse-as-library apps/macos/Power/*.swift
      - name: Headless Swift pipeline (mock agents, real gates)
        run: |
          cat > /tmp/Smoke.swift << 'SWIFT'
          import Foundation
          @main struct Smoke {
              static func main() async throws {
                  setenv("POWER_MOCK_AGENTS", "1", 1)
                  setenv("POWER_ROOT", FileManager.default.currentDirectoryPath, 1)
                  let repo = NSTemporaryDirectory() + UUID().uuidString
                  try FileManager.default.createDirectory(atPath: repo, withIntermediateDirectories: true)
                  let engine = await RunEngine()
                  await engine.start(goal: "ci smoke: csv to json cli", repoDir: repo, features: RunFeatures())
                  for _ in 0..<900 {
                      try await Task.sleep(for: .milliseconds(200))
                      if await engine.specText != nil { await engine.approve() }
                      if await !engine.running { break }
                  }
                  guard await engine.done?.contains("deployable   yes") == true,
                        await engine.gates.count == 3 else {
                      print("FAIL"); exit(1)
                  }
                  print("PASS: 3 gates, deployable yes")
              }
          }
          SWIFT
          swiftc -o /tmp/smoke -parse-as-library apps/macos/Power/Engine.swift apps/macos/Power/Models.swift /tmp/Smoke.swift
          /tmp/smoke
